name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Linux-only on purpose. ndarray-linalg is pinned to the `openblas-system`
# feature, which needs a system OpenBLAS. That is a one-line apt install on
# ubuntu-latest but is unresolved on the macOS and Windows runners, so those
# legs are deferred rather than left permanently red. See PR description.
jobs:
  rust:
    name: Rust build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopenblas-dev pkg-config gfortran

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo check (all targets, locked)
        run: cargo check --all-targets --locked

      - name: cargo test
        run: cargo test --locked

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 removed: end of life, and setup-python cannot install it on the
        # current ubuntu-latest image. 3.13 is excluded because this tree is
        # on pyo3 0.21.
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Install system OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopenblas-dev pkg-config gfortran

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `maturin develop` refuses to run outside a virtualenv, which is why
      # the previous workflow could never reach the test step.
      - name: Create virtualenv for maturin develop
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest pytest-cov numpy

      - name: Build the optimizr._core extension
        run: maturin develop --release

      - name: Run the Python test suite
        run: pytest tests/ -v --cov=optimizr --cov-report=xml

      # Informational only. A fork has no CODECOV_TOKEN, so this upload
      # cannot be a gate. It is not allowed to mask a test failure because
      # it runs after pytest.
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: ./coverage.xml

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pinned so a new tool release cannot turn a green gate red.
      - name: Install pinned lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install black==26.5.1 ruff==0.16.7 mypy==2.3.1

      - name: black --check
        run: black --check python/

      - name: ruff
        run: ruff check python/

      - name: mypy
        run: mypy python/optimizr/ --ignore-missing-imports

  wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [rust, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install system OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libopenblas-dev pkg-config gfortran

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install maturin
        run: python -m pip install maturin

      - name: maturin build
        run: maturin build --release --out dist/

      # v3 was retired by GitHub and is a hard failure on current runners.
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-ubuntu-latest-cp311
          path: dist/
